<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#161233">
<title>Les 72 héros</title>
<style>
  html, body { margin: 0; background: #161233; color: #fff; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { position: sticky; top: 0; z-index: 2; background: #161233; padding: calc(8px + env(safe-area-inset-top)) 12px 8px; }
  .row { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 17px; }
  a.btn, button { appearance: none; border: 0; border-radius: 12px; padding: 9px 13px; font: inherit; font-weight: 700; font-size: 15px; color: #fff; background: #2d2760; text-decoration: none; box-shadow: 0 3px 0 #0c0920; }
  .tabs { display: flex; gap: 6px; margin-top: 10px; }
  .tabs button { flex: 1; padding: 9px 4px; }
  .tabs button.on { background: var(--c); }
  main { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; padding: 10px 12px calc(24px + env(safe-area-inset-bottom)); max-width: 1100px; margin: 0 auto; }
  .card { border-radius: 16px; overflow: hidden; background: var(--bg); color: #241a2c; text-align: center; border-bottom: 5px solid var(--r); }
  .card canvas { display: block; width: 100%; aspect-ratio: 16 / 15; }
  .card b { display: block; font-size: 15px; line-height: 1.15; padding: 0 6px; }
  .card i { display: block; font-style: normal; font-weight: 700; font-size: 12.5px; color: var(--r); margin-top: 2px; }
  .card small { display: block; font-size: 11px; line-height: 1.2; color: #4a4050; padding: 3px 6px 8px; min-height: 27px; }
</style>
</head>
<body>
<header>
  <div class="row"><a class="btn" href="index.html">←</a><span>Les 72 héros</span><a class="btn" href="index.html" style="margin-left:auto">Animations</a></div>
  <div class="tabs" id="tabs"></div>
</header>
<main id="grid"></main>
<script src="heros.js"></script>
<script src="heros-page.js"></script>
</body>
</html>
