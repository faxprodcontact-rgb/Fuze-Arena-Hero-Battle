<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#161233">
<title>Aperçu des animations</title>
<style>
  html, body { margin: 0; height: 100%; background: #161233; overflow: hidden; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-user-select: none; user-select: none; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: manipulation; }
  .bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); display: flex; gap: 8px; justify-content: center; background: linear-gradient(#161233dd, #161233); }
  .top { position: fixed; left: 0; right: 0; top: 0; padding: calc(8px + env(safe-area-inset-top)) 12px 8px; display: flex; align-items: center; gap: 10px; color: #fff; font-weight: 700; }
  a.btn, button { appearance: none; border: 0; border-radius: 12px; padding: 10px 14px; font: inherit; font-weight: 700; font-size: 15px; color: #fff; background: #2d2760; text-decoration: none; box-shadow: 0 3px 0 #0c0920; }
  button.on { background: #2fbf71; }
  button:active, a.btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #0c0920; }
  .hint { position: fixed; left: 0; right: 0; bottom: calc(64px + env(safe-area-inset-bottom)); text-align: center; color: #fff; font-size: 13px; opacity: .85; text-shadow: 0 1px 2px #000; pointer-events: none; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="top"><a class="btn" href="../index.html">←</a><span>Animations</span><a class="btn" href="heros.html" style="margin-left:auto">Les 72 héros</a></div>
<div class="hint">Touche un personnage : il lance sa compétence</div>
<div class="bar">
  <button id="pause">Pause</button>
  <button id="slow">Ralenti</button>
  <button id="fast">×2</button>
  <button id="again">Rejouer</button>
</div>
<script src="data.js"></script>
<script src="heros.js"></script>
<script src="monstres.js"></script>
<script src="apercu.js"></script>
</body>
</html>
