    <!-- chargement-style:debut -->
    <style>
      /* écran de chargement (fabriqué par refonte-graphique/pixel/ui/chargement.py) : visible pendant le téléchargement
         du jeu, retiré par main.tsx. Le dessin est peint à sa vraie taille (256 × 555) dans le canvas puis agrandi
         sans flou : --px = la taille d'un pixel du dessin, assez grande pour couvrir l'écran (colonne de 480 px au plus). */
      #splash { position: fixed; inset: 0; z-index: 9999; background: #120c1c; transition: opacity .5s; }
      #splash.gone { opacity: 0; pointer-events: none; }
      #splash .sp { position: absolute; top: 0; bottom: 0; left: 50%; width: min(100%, 480px); transform: translateX(-50%); overflow: hidden;
        --px: max(calc(min(100vw, 480px) / 256), calc(100vh / 555)); background: #2a1424; }
      @supports (height: 100dvh) { #splash .sp { --px: max(calc(min(100vw, 480px) / 256), calc(100dvh / 555)); } }
      #splash canvas, #splash .logo, #splash .load { position: absolute; }
      #splash canvas, #splash .load { image-rendering: pixelated; }
      #splash canvas { width: calc(var(--px) * 256); height: calc(var(--px) * 555); left: calc(50% - var(--px) * 128.0); top: calc((100% - var(--px) * 555) * 0.72); }
      /* le logo est vectoriel (net à toutes les tailles) : 62 % de la colonne, 280 px et 19 % de la hauteur au plus,
         sous l'encoche avec de l'air autour (demande du propriétaire : « affiché trop gros ») */
      #splash .logo { left: 50%; top: calc(env(safe-area-inset-top, 0px) + 18px); width: min(62%, 280px, calc(19vh * 1.333)); height: auto; aspect-ratio: 632 / 474; overflow: visible; transform: translateX(-50%); }
      #splash .load { left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + var(--px) * 12); width: calc(var(--px) * 140); height: calc(var(--px) * 14); transform: translateX(-50%);
        background: url(data:image/webp;base64,UklGRp4AAABXRUJQVlA4TJIAAAAvi0ADEE9gJAASEhki74lucYgDXGMmABkFvALof6nglWPnMqhpJAVaGVcdjwTkowYZlPMfAOTOF9Oi0eFxpuvubQCmtbU3STbogMahUfgu6whVZgQU6M4/Myk2ov8TgKgWEal7DUpMe9DgQNUbhb8/Fk9BrEHwVKKD001AB+Cpt0p/fy0e3UCDOyXrrsEAI6pFBA==) 0 0 / 100% 100%; }
      #splash .load i { position: absolute; left: calc(var(--px) * 4); top: calc(var(--px) * 4); height: calc(var(--px) * 6); width: calc(var(--px) * 132); }
      #splash .load b { display: block; height: 100%; width: 0; animation: splash-load 6s forwards;
        background: linear-gradient(#fff6c0 0 16.6%, #ffd84a 16.6% 50%, #f5a524 50% 83.3%, #c0601a 83.3%); }
      @keyframes splash-load { 0%{width:0.00%;animation-timing-function:steps(40)} 8%{width:30.00%;animation-timing-function:steps(29)} 20%{width:52.00%;animation-timing-function:steps(24)} 40%{width:70.00%;animation-timing-function:steps(16)} 65%{width:82.00%;animation-timing-function:steps(13)} 100%{width:92%} }
      #splash.done .load b { width: 100%; animation: none; }
    </style>
