    <style>

         du jeu, retiré par main.tsx. Le dessin est peint à sa vraie taille (340 × 737) dans le canvas puis agrandi
         sans flou : --px = la taille d'un pixel du dessin, assez grande pour couvrir l'écran (colonne de 480 px au plus). */
      #splash { position: fixed; inset: 0; z-index: 9999; background: #120c1c; transition: opacity .5s; }
      #splash.gone { opacity: 0; pointer-events: none; }
      #splash .sp { position: absolute; top: 0; bottom: 0; left: 50%; width: min(100%, 480px); transform: translateX(-50%); overflow: hidden;
        --px: max(calc(min(100vw, 480px) / 340), calc(100vh / 737)); background: #2a1424; }
      @supports (height: 100dvh) { #splash .sp { --px: max(calc(min(100vw, 480px) / 340), calc(100dvh / 737)); } }
      #splash canvas, #splash img, #splash .load { position: absolute; image-rendering: pixelated; image-rendering: crisp-edges; }
      #splash canvas { width: calc(var(--px) * 340); height: calc(var(--px) * 737); left: calc(50% - var(--px) * 170.0); top: calc((100% - var(--px) * 737) * 0.7); }
      #splash img { left: 50%; top: calc(env(safe-area-inset-top, 0px) + var(--px) * 6); width: calc(var(--px) * 236); height: calc(var(--px) * 156); transform: translateX(-50%); }
      #splash .load { left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + var(--px) * 16); width: calc(var(--px) * 150); height: calc(var(--px) * 14); transform: translateX(-50%);
        background: url(data:image/webp;base64,UklGRp4AAABXRUJQVlA4TJEAAAAvlUADEE9gJAASEhki74lucYgDXGMmABkFvALof6nglWPnMqhpJAVaGVcdjwTkowYZlPMfAOTOF9Oi0eFxpuvubQCmtbU3STboAY1Do/Bd1hGqzAgo0J1/5xQb0f8JQNSciDSDKSWmA5hypPqLIzOeq9KQmBKUTo1xeREYA5T+6syM96roDqY8KNkOU4YYUXMiAA==) 0 0 / 100% 100%; }
      #splash .load i { position: absolute; left: calc(var(--px) * 4); top: calc(var(--px) * 4); height: calc(var(--px) * 6); width: calc(var(--px) * 142); }
      #splash .load b { display: block; height: 100%; width: 0; animation: splash-load 6s forwards;
        background: linear-gradient(#fff6c0 0 16.6%, #ffd84a 16.6% 50%, #f5a524 50% 83.3%, #c0601a 83.3%); }
      @keyframes splash-load { 0%{width:0.00%;animation-timing-function:steps(43)} 8%{width:30.00%;animation-timing-function:steps(31)} 20%{width:52.00%;animation-timing-function:steps(26)} 40%{width:70.00%;animation-timing-function:steps(17)} 65%{width:82.00%;animation-timing-function:steps(14)} 100%{width:92%} }
      #splash.done .load b { width: 100%; animation: none; }
