# Site de test : à chaque envoi, le jeu est vérifié, construit et mis en ligne sur GitHub Pages
# (branche gh-pages) : https://faxprodcontact-rgb.github.io/Fuze-Arena-Hero-Battle/
name: Site de test

on:
  push:
    branches: [main, claude/serene-feynman-svbwjf]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site-test
  cancel-in-progress: true

jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: touch dist/.nojekyll
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
